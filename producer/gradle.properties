# kotlin.native.home is set by CI (kotlin-hap-smoke-test) or your local dist path.

# kotlin.incremental.native=true
# org.gradle.caching=true

# Override with -PkotlinVersion=… (CI) to match the compiler built in kn-action.
kotlinVersion=2.2.21-0.5.0-02

# 发布的 klib 统一版本号(producer 各模块 + consumer implementation 引用, 不散落硬编码)。
# 22 = OHOS API level, 0.5 = 当前对齐版本。
klibVersion=22-0.5

# kotlin.native.home not set: KGP should resolve kotlin-native-compiler-embeddable from Maven
# (eazytec repo). If this fails, fall back to pointing at the local CPF 2.2.21-0.5.0-02 dist.

kotlin.native.cacheKind=none
kotlin.native.cacheKind.ohosArm64=none

# Settings for startHarmonyApp gradle task
# DevEco Studio install path
devEcoStudioDir=/Applications/DevEco-Studio.app
# harmony project root folder, absolute path or relative to this project root
harmonyAppDir=harmonyApp
# base name of the kotlin native library artifact
baseName=c2k
# kn library build task name, ohosArm64("myTarget") -> myTarget
buildTaskSuffix=ohosArm64
# where so artifact of kotlin project should go
soFileDst=entry/libs/arm64-v8a/
# where header artifact of kotlin project should go
hFileDst=entry/src/main/cpp/include/
# harmony app entry module folder name, relative to harmonyAppDir
entryModuleDir=entry
# the ability to start, click run in DevEco Studio, this comes after 'hdc shell aa start -a' in run log
abilityName=EntryAbility
